<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="韓国語単語" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icon-180.png" />
  <title>韓国語単語トレーナー</title>
  <style>
    :root {
      --bg: #f7f7f9;
      --card: #ffffff;
      --text: #17171a;
      --muted: #6f7078;
      --line: #e6e6eb;
      --accent: #111111;
      --soft: #f0f0f4;
      --danger: #c62828;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body { padding: env(safe-area-inset-top) 16px calc(92px + env(safe-area-inset-bottom)); }
    button, input, textarea { font: inherit; }
    .app { max-width: 680px; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 14px 2px 18px; }
    h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
    .header-actions { display: flex; gap: 8px; }
    .icon-btn { border: 0; border-radius: 12px; background: var(--card); padding: 10px 12px; box-shadow: 0 1px 8px rgba(0,0,0,.05); }
    .card {
      background: var(--card); border-radius: 28px; min-height: 430px; padding: 34px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,.07); display: flex; flex-direction: column; justify-content: center;
      user-select: none; -webkit-tap-highlight-color: transparent; cursor: pointer;
    }
    .korean { font-size: clamp(42px, 11vw, 70px); font-weight: 760; text-align: center; letter-spacing: -0.04em; line-height: 1.08; }
    .hint { margin-top: 18px; text-align: center; color: var(--muted); font-size: 14px; }
    .answer { margin-top: 30px; border-top: 1px solid var(--line); padding-top: 26px; animation: fade .18s ease-out; }
    .jp { font-size: 28px; font-weight: 700; text-align: center; }
    .section { margin-top: 24px; }
    .section-label { color: var(--muted); font-size: 13px; font-weight: 700; margin-bottom: 8px; }
    .example-ko { font-size: 19px; line-height: 1.55; font-weight: 600; }
    .example-jp { font-size: 15px; line-height: 1.55; color: var(--muted); margin-top: 4px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { background: var(--soft); border-radius: 999px; padding: 8px 11px; font-size: 14px; }
    .footer-note { text-align: center; margin: 14px 0 0; color: var(--muted); font-size: 13px; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.34); display: none; align-items: flex-end; z-index: 20; }
    .modal.show { display: flex; }
    .sheet { width: 100%; max-height: 90vh; overflow: auto; background: var(--card); border-radius: 24px 24px 0 0; padding: 22px 18px calc(24px + env(safe-area-inset-bottom)); }
    .sheet-inner { max-width: 680px; margin: 0 auto; }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .sheet h2 { margin: 0; font-size: 22px; }
    .close { border: 0; background: var(--soft); width: 36px; height: 36px; border-radius: 50%; }
    label { display: block; margin-top: 16px; font-size: 13px; color: var(--muted); font-weight: 700; }
    input, textarea { width: 100%; margin-top: 7px; padding: 13px 14px; border: 1px solid var(--line); border-radius: 14px; background: #fff; outline: none; }
    textarea { min-height: 76px; resize: vertical; }
    input:focus, textarea:focus { border-color: #a8a8b1; }
    .primary { width: 100%; border: 0; border-radius: 16px; background: var(--accent); color: white; padding: 15px; margin-top: 20px; font-weight: 700; }
    .secondary { width: 100%; border: 1px solid var(--line); border-radius: 16px; background: white; padding: 13px; margin-top: 10px; font-weight: 650; }
    .word-list { margin-top: 18px; }
    .word-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
    .word-main { min-width: 0; }
    .word-ko { font-weight: 750; font-size: 18px; }
    .word-jp { color: var(--muted); font-size: 14px; margin-top: 3px; }
    .delete { border: 0; background: #fff0f0; color: var(--danger); border-radius: 10px; padding: 8px 10px; }
    .tiny { color: var(--muted); font-size: 12px; line-height: 1.45; }
    .empty { text-align: center; color: var(--muted); padding: 32px 0; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @media (min-width: 700px) {
      body { padding-top: 28px; }
      .modal { align-items: center; justify-content: center; padding: 30px; }
      .sheet { border-radius: 24px; max-width: 720px; padding-bottom: 24px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>韓国語単語</h1>
      <div class="header-actions">
        <button class="icon-btn" id="listBtn" aria-label="単語一覧">一覧</button>
        <button class="icon-btn" id="addBtn" aria-label="単語追加">＋</button>
      </div>
    </header>

    <section class="card" id="flashcard" aria-live="polite">
      <div class="korean" id="korean">시작</div>
      <div class="hint" id="hint">タップすると答えを表示</div>
      <div class="answer" id="answer" hidden>
        <div class="jp" id="japanese"></div>
        <div class="section">
          <div class="section-label">例文</div>
          <div class="example-ko" id="exampleKo"></div>
          <div class="example-jp" id="exampleJp"></div>
        </div>
        <div class="section">
          <div class="section-label">関連する単語</div>
          <div class="chips" id="related"></div>
        </div>
      </div>
    </section>
    <p class="footer-note">答え表示後にもう一度タップすると、次の単語へ</p>
  </main>

  <div class="modal" id="addModal" role="dialog" aria-modal="true">
    <div class="sheet"><div class="sheet-inner">
      <div class="sheet-head"><h2>単語を追加</h2><button class="close" data-close="addModal">×</button></div>
      <form id="addForm">
        <label>韓国語<input id="fKo" required placeholder="예: 약속"></label>
        <label>日本語<input id="fJp" required placeholder="例：約束"></label>
        <label>韓国語の例文<textarea id="fExKo" required placeholder="예: 친구와 약속이 있어요."></textarea></label>
        <label>例文の日本語訳<textarea id="fExJp" required placeholder="例：友だちと約束があります。"></textarea></label>
        <label>関連語（カンマ区切り）<input id="fRel" placeholder="친구, 만나다"></label>
        <button class="primary" type="submit">追加する</button>
      </form>
    </div></div>
  </div>

  <div class="modal" id="listModal" role="dialog" aria-modal="true">
    <div class="sheet"><div class="sheet-inner">
      <div class="sheet-head"><h2>単語一覧</h2><button class="close" data-close="listModal">×</button></div>
      <div class="word-list" id="wordList"></div>
      <button class="secondary" id="exportBtn">単語データを書き出す</button>
      <button class="secondary" id="importBtn">単語データを読み込む</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
      <p class="tiny">追加した単語はこの端末のブラウザ内に保存されます。Safariのサイトデータを削除すると消える場合があります。</p>
    </div></div>
  </div>

<script>
const DEFAULT_WORDS = [
  {id:'d1', ko:'약속', jp:'約束', exKo:'친구와 약속이 있어요.', exJp:'友だちと約束があります。', related:['친구 友だち','만나다 会う']},
  {id:'d2', ko:'준비하다', jp:'準備する', exKo:'여행을 준비하고 있어요.', exJp:'旅行の準備をしています。', related:['여행 旅行','계획 計画']},
  {id:'d3', ko:'필요하다', jp:'必要だ', exKo:'이 일에는 시간이 필요해요.', exJp:'この仕事には時間が必要です。', related:['시간 時間','중요하다 重要だ']},
  {id:'d4', ko:'연습하다', jp:'練習する', exKo:'매일 한국어를 연습해요.', exJp:'毎日韓国語を練習します。', related:['공부하다 勉強する','매일 毎日']},
  {id:'d5', ko:'경험', jp:'経験', exKo:'좋은 경험이 되었어요.', exJp:'よい経験になりました。', related:['좋다 良い','처음 初めて']}
];

const STORE_KEY='korean-word-trainer-v1';
let words = loadWords();
let current = null;
let revealed = false;

function loadWords(){
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY));
    return Array.isArray(saved) && saved.length ? saved : DEFAULT_WORDS;
  } catch { return DEFAULT_WORDS; }
}
function saveWords(){ localStorage.setItem(STORE_KEY, JSON.stringify(words)); }
function randomWord(){
  if(!words.length){ current=null; renderEmpty(); return; }
  if(words.length===1){ current=words[0]; }
  else {
    let next;
    do { next = words[Math.floor(Math.random()*words.length)]; } while(current && next.id===current.id);
    current = next;
  }
  revealed=false; renderCard();
}
function renderEmpty(){
  document.querySelector('#korean').textContent='単語がありません';
  document.querySelector('#hint').textContent='＋から単語を追加してください';
  document.querySelector('#answer').hidden=true;
}
function renderCard(){
  if(!current) return renderEmpty();
  document.querySelector('#korean').textContent=current.ko;
  document.querySelector('#japanese').textContent=current.jp;
  document.querySelector('#exampleKo').textContent=current.exKo || '';
  document.querySelector('#exampleJp').textContent=current.exJp || '';
  const related=document.querySelector('#related'); related.innerHTML='';
  (current.related||[]).forEach(x=>{ const s=document.createElement('span'); s.className='chip'; s.textContent=x; related.appendChild(s); });
  document.querySelector('#answer').hidden=!revealed;
  document.querySelector('#hint').textContent = revealed ? 'もう一度タップで次の単語' : 'タップすると答えを表示';
}

document.querySelector('#flashcard').addEventListener('click',()=>{
  if(!current) return;
  if(!revealed){ revealed=true; renderCard(); }
  else randomWord();
});

function openModal(id){ document.querySelector('#'+id).classList.add('show'); }
function closeModal(id){ document.querySelector('#'+id).classList.remove('show'); }
document.querySelector('#addBtn').onclick=()=>openModal('addModal');
document.querySelector('#listBtn').onclick=()=>{ renderList(); openModal('listModal'); };
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal(b.dataset.close));
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{ if(e.target===m) closeModal(m.id); }));

document.querySelector('#addForm').addEventListener('submit',e=>{
  e.preventDefault();
  const rel = document.querySelector('#fRel').value.split(',').map(s=>s.trim()).filter(Boolean);
  const w={
    id:'u'+Date.now(),
    ko:document.querySelector('#fKo').value.trim(),
    jp:document.querySelector('#fJp').value.trim(),
    exKo:document.querySelector('#fExKo').value.trim(),
    exJp:document.querySelector('#fExJp').value.trim(),
    related:rel
  };
  words.push(w); saveWords(); e.target.reset(); closeModal('addModal'); current=w; revealed=false; renderCard();
});

function renderList(){
  const root=document.querySelector('#wordList'); root.innerHTML='';
  if(!words.length){ root.innerHTML='<div class="empty">単語がありません</div>'; return; }
  words.forEach(w=>{
    const row=document.createElement('div'); row.className='word-row';
    const main=document.createElement('div'); main.className='word-main';
    main.innerHTML=`<div class="word-ko"></div><div class="word-jp"></div>`;
    main.querySelector('.word-ko').textContent=w.ko; main.querySelector('.word-jp').textContent=w.jp;
    const del=document.createElement('button'); del.className='delete'; del.textContent='削除';
    del.onclick=()=>{
      words=words.filter(x=>x.id!==w.id); saveWords();
      if(current && current.id===w.id) current=null;
      renderList(); randomWord();
    };
    row.append(main,del); root.appendChild(row);
  });
}

document.querySelector('#exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(words,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='korean-words.json'; a.click(); URL.revokeObjectURL(url);
};
document.querySelector('#importBtn').onclick=()=>document.querySelector('#importFile').click();
document.querySelector('#importFile').addEventListener('change',async e=>{
  const f=e.target.files?.[0]; if(!f) return;
  try{
    const data=JSON.parse(await f.text());
    if(!Array.isArray(data)) throw new Error();
    words=data.filter(w=>w && w.ko && w.jp).map((w,i)=>({
      id:w.id||('i'+Date.now()+i), ko:String(w.ko), jp:String(w.jp), exKo:String(w.exKo||''), exJp:String(w.exJp||''), related:Array.isArray(w.related)?w.related.map(String):[]
    }));
    saveWords(); renderList(); randomWord(); alert('読み込みました');
  }catch{ alert('読み込みに失敗しました。JSON形式を確認してください。'); }
  e.target.value='';
});

if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{})); }
randomWord();
</script>
</body>
</html>
